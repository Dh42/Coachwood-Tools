name: CI

# Runs on every push to every branch. A passing run on a branch other than
# main is what auto-merge.yml acts on. There is no pull_request trigger: the
# push run already reports on the branch's commit, so it would only run twice.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint --test

  assets:
    name: Vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the server's Plesk Node (/opt/plesk/node/26).
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run build

  tests:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mariadb]
    services:
      mariadb:
        # Matches production (MariaDB 10.11.14).
        image: mariadb:10.11.14
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: coachwood_tools_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_mysql, mbstring, intl, gd, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Run tests
        env:
          # phpunit.xml defaults to SQLite :memory:; real environment
          # variables win over it, so the MariaDB leg sets them here.
          DB_CONNECTION: ${{ matrix.database == 'mariadb' && 'mariadb' || 'sqlite' }}
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ${{ matrix.database == 'mariadb' && 'coachwood_tools_test' || ':memory:' }}
          DB_USERNAME: root
          DB_PASSWORD: ci
        run: php artisan test --parallel
