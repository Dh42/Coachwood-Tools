name: Auto-merge

# Merges a pull request once the CI workflow has passed on its latest commit.
# To stop a pull request merging, mark it as a draft or add the "hold" label.
#
# workflow_run workflows only run from the copy on main, so this starts working
# for pull requests opened after it is merged.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Merge the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pr=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open --json number,isDraft,labels,headRefOid --jq '.[0] // empty')
          if [ -z "$pr" ]; then echo "No open pull request for $HEAD_BRANCH."; exit 0; fi

          number=$(jq -r .number <<<"$pr")
          if [ "$(jq -r .isDraft <<<"$pr")" = true ]; then echo "#$number is a draft; not merging."; exit 0; fi
          if jq -e '.labels[] | select(.name == "hold")' <<<"$pr" >/dev/null; then echo "#$number has the hold label; not merging."; exit 0; fi
          if [ "$(jq -r .headRefOid <<<"$pr")" != "$HEAD_SHA" ]; then echo "#$number has newer commits than the tested one; their CI run decides."; exit 0; fi

          gh pr merge "$number" --repo "$REPO" --merge --match-head-commit "$HEAD_SHA" --delete-branch
