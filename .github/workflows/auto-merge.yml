name: Auto-merge

# Push a branch; once CI passes on it, this opens a pull request for it (if it
# has none) and merges it into main, which deploys it. The pull request stays
# as the record of the step.
#
# It does not merge when:
#  - the branch name starts with wip/
#  - the branch's open pull request is a draft or has the "hold" label
#  - the branch is behind main (CI tested it without main's newer commits;
#    rebase or merge main into it and push again)
#  - the branch has moved on since the tested commit (the newer run decides)
#
# workflow_run workflows only run from the copy on main, so changes here take
# effect once they are merged.
#
# Needs: Settings > Actions > General > Workflow permissions >
# "Allow GitHub Actions to create and approve pull requests".

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch != 'main' &&
      !startsWith(github.event.workflow_run.head_branch, 'wip/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Open and merge the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          current=$(gh api "repos/$REPO/branches/$HEAD_BRANCH" --jq .commit.sha 2>/dev/null || true)
          if [ "$current" != "$HEAD_SHA" ]; then echo "$HEAD_BRANCH has moved on (or is gone) since the tested commit; its newer run decides."; exit 0; fi

          behind=$(gh api "repos/$REPO/compare/main...$HEAD_SHA" --jq .behind_by)
          if [ "$behind" != 0 ]; then echo "::warning::$HEAD_BRANCH is $behind commit(s) behind main. Rebase or merge main into it and push again."; exit 0; fi

          pr=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open --json number,isDraft,labels --jq '.[0] // empty')
          if [ -z "$pr" ]; then
            title=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)
            commits=$(gh api "repos/$REPO/compare/main...$HEAD_SHA" --jq '.commits[] | "- " + (.commit.message | split("\n")[0])')
            body=$(printf 'Opened automatically after CI passed on `%s`.\n\nCommits:\n%s\n' "${HEAD_SHA:0:7}" "$commits")
            url=$(gh pr create --repo "$REPO" --head "$HEAD_BRANCH" --base main --title "$title" --body "$body")
            number=${url##*/}
            echo "Opened #$number."
          else
            number=$(jq -r .number <<<"$pr")
            if [ "$(jq -r .isDraft <<<"$pr")" = true ]; then echo "#$number is a draft; not merging."; exit 0; fi
            if jq -e '.labels[] | select(.name == "hold")' <<<"$pr" >/dev/null; then echo "#$number has the hold label; not merging."; exit 0; fi
          fi

          gh pr merge "$number" --repo "$REPO" --merge --match-head-commit "$HEAD_SHA" --delete-branch
